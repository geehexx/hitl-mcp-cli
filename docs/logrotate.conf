# Logrotate config for HITL MCP interaction log
# Install: sudo cp docs/logrotate.conf /etc/logrotate.d/hitl-mcp
# Adjust the path if XDG_STATE_HOME differs from ~/.local/state

~/.local/state/hitl-mcp/interactions.jsonl {
    daily
    rotate 7
    compress
    missingok
    notifempty
    size 10M
}
